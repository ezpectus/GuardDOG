[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guarddog"
version = "0.2.0"
description = "Hybrid repo scanner: local AST+regex rules, optional LLM audit, severity-gated exit codes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1"]

[project.scripts]
guarddog = "cli:main"

[tool.setuptools]
py-modules = ["main", "cli", "config", "report"]
packages = ["parsers", "llm_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
