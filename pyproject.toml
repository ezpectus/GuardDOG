[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guarddog"
version = "0.2.0"
description = "Hybrid repo scanner: local AST+regex rules, optional LLM audit, severity-gated exit codes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.1", "mypy>=1.8"]

[project.scripts]
guarddog = "cli:main"

[tool.setuptools]
py-modules = ["main", "cli", "config", "report"]
packages = ["parsers", "llm_client", "templates"]

[tool.setuptools.package-data]
templates = ["*.html", "*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true
mypy_path = "."

# test files import as top-level modules (tests/ has no __init__.py)
[[tool.mypy.overrides]]
module = ["test_cli", "test_report", "test_scanners", "conftest"]
disallow_untyped_defs = false
disallow_untyped_calls = false
