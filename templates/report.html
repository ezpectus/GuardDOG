<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GuardDOG report — $target</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: ui-monospace, Consolas, monospace; background:#11131a; color:#e6e9ef;
         margin:0; padding:32px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .meta { color:#8b93a7; font-size:12px; margin-bottom:24px; }
  .cards { display:flex; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
  .card { background:#1a1d27; border-top:3px solid #444; border-radius:6px;
          padding:14px 28px; text-align:center; min-width:110px; }
  .num { font-size:28px; font-weight:700; }
  .lbl { font-size:11px; letter-spacing:1px; color:#8b93a7; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:#8b93a7; font-size:11px; letter-spacing:1px;
       border-bottom:1px solid #2a2e3d; padding:8px; }
  td { border-bottom:1px solid #1f2330; padding:8px; vertical-align:top; }
  tr:hover td { background:#171a23; }
  .sev { color:#0d0f14; font-weight:700; font-size:11px; padding:2px 8px;
         border-radius:4px; }
  code { color:#9db8ff; }
  pre { background:#0d0f14; padding:8px; border-radius:4px; overflow:auto;
        max-width:70ch; font-size:12px; }
  details summary { cursor:pointer; color:#8b93a7; font-size:11px; }
  .fix { color:#46a758; font-size:12px; margin-top:4px; }
  .fix::before { content:"fix → "; color:#8b93a7; }
</style>
</head>
<body>
<h1>GuardDOG report</h1>
<div class="meta">target: <code>$target</code> &middot; $date &middot;
  $files_scanned files scanned &middot; llm: $llm_note</div>
<div class="cards">$cards</div>
<table>
<thead><tr><th>Severity</th><th>Rule</th><th>Location</th><th>Finding</th><th>Source</th></tr></thead>
<tbody>$rows</tbody>
</table>
</body>
</html>
